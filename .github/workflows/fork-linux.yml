name: Fork Linux

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'wen1701/cc-switch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev patchelf
          corepack enable
          corepack install
          rustup toolchain install 1.95 --profile minimal --component rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Frontend regression tests
        run: pnpm test:unit tests/components/CodexFormFields.discovery.test.tsx tests/components/ProviderForm.discovery.test.tsx tests/hooks/useCodexConfigState.discovery.test.ts tests/components/ProviderForm.codexCatalog.test.ts tests/hooks/useCodexConfigState.catalog.test.ts tests/hooks/useCodexConfigState.bearer.test.ts tests/components/GrokBuildProviderForm.test.tsx tests/components/ClaudeFormFields.test.tsx
      - run: pnpm build:renderer
      - name: Backend regression tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --lib codex_discovery::tests
          cargo test --lib codex_discovered_catalog_follows_the_selected_provider
      - name: Build Debian package
        run: pnpm tauri build --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: cc-switch-provider-models-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
